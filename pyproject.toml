[project]
name = "jyotish-kit"
version = "0.1.0"
description = "Type-safe, developer-first Jyotish knowledge engine, SDK, and REST API"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "jsonschema>=4.26.0",
    "lark>=1.3.1",
    "pydantic>=2.10.0",
    "pyswisseph>=2.10.3.2",
    "pyyaml>=6.0.2",
    "rich>=13.9.0",
    "typer>=0.15.0",
    "uvicorn>=0.34.0",
]

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.0",
    "hypothesis>=6.120.0",
    "pytest>=8.3.0",
]

[project.scripts]
jyotish-kit = "jyotish_kit.cli:app"
