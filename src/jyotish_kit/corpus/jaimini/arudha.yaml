# Arudha lagna (AL) and darapada (A7): gains, losses and relations judged from the arudha.
defaults:
  school: jaimini
  classical_strength: primary
  source:
    text: Brihat Parashara Hora Shastra
    chapter: 29
    edition: "R. Santhanam (tr.), Brihat Parasara Hora Sastra, Ranjan Publications, New Delhi, 1984"
    note: "arudha chapter; verse to be confirmed against the edition"

rules:
  - id: BPHS.29.AL11Occupied
    name: Planets in the 11th from arudha lagna
    source: {paraphrase: "Planets in, or aspecting, the 11th from the arudha lagna bring gains; by fair means if benefics, by questionable means if malefics."}
    condition: "len(occupants_sign(sign_from(arudha(1), 11))) > 0"
    effect: {domains: [gains, wealth], polarity: 1, themes: ["income", "gains"]}
    tags: [arudha, bhava:11]

  - id: BPHS.29.AL12Malefic
    name: Malefics in the 12th from arudha lagna
    source: {paraphrase: "Malefics in the 12th from the arudha lagna, unaided by benefics, cause heavy expenditure and losses."}
    condition: >-
      any(m in occupants_sign(sign_from(arudha(1), 12)): malefic(m))
      and not any(b in occupants_sign(sign_from(arudha(1), 12)): benefic(b))
    effect: {domains: [expenditure, losses], polarity: -1, themes: ["drain of resources"]}
    tags: [arudha, bhava:12]

  - id: BPHS.29.AL12Benefic
    name: Benefics in the 12th from arudha lagna
    source: {paraphrase: "Benefics in the 12th from the arudha lagna direct expenditure to good causes."}
    condition: "any(b in occupants_sign(sign_from(arudha(1), 12)): benefic(b))"
    effect: {domains: [expenditure, dharma], polarity: 0, themes: ["spending on good causes"]}
    classical_strength: supporting
    tags: [arudha, bhava:12]

  - id: BPHS.29.ALDarapadaHarmony
    name: Arudha lagna and darapada in mutual kendra, trikona or 3/11
    source: {paraphrase: "The arudha lagna and the darapada (A7) in mutual kendras, trikonas or 3rd/11th places give harmony between the native and spouse or partners."}
    condition: "any(n in [1, 3, 4, 5, 7, 9, 10, 11]: sign_from(arudha(1), n) == arudha(7))"
    effect: {domains: [marriage, partnership], polarity: 1, themes: ["harmony with spouse and partners"]}
    tags: [arudha, domain:marriage, bhava:7]

  - id: BPHS.29.ALDarapadaDiscord
    name: Arudha lagna and darapada in mutual 6/8 or 2/12
    source: {paraphrase: "The arudha lagna and darapada in mutual 6th/8th or 2nd/12th places bring discord or distance between the native and spouse or partners."}
    condition: "any(n in [2, 6, 8, 12]: sign_from(arudha(1), n) == arudha(7))"
    effect: {domains: [marriage, partnership], polarity: -1, themes: ["discord or distance with spouse"]}
    tags: [arudha, domain:marriage, bhava:7]
