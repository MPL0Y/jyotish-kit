# KP cuspal sub lord theory for every topic except marriage (kp/marriage.yaml), health and longevity
# (their 6th/8th-house framing needs its own rules). Generated once; edit directly.
defaults:
  school: kp
  classical_strength: primary
  varga: KP
  source:
    text: Krishnamurti Padhdhati Reader
    edition: K.S. Krishnamurti, Krishnamurti Padhdhati Readers III (Predictive Stellar Astrology) and IV (Marriage, Married
      Life and Children), Krishman & Co., Madras
    note: the cuspal sub lord principle applied per matter; the favouring and opposing house groups are those of topics.yaml
      (standard KP practice); section/page to be confirmed
rules:
- id: KP.III.SelfSubPromise
  name: 1 cusp sub lord signifies 1, 5, 11 (self)
  source:
    chapter: III
    paraphrase: If the sub lord of cusp 1 signifies houses 1, 5, 11, self matters are promised.
  condition: signifies(kp_sub_lord(1), [1, 5, 11])
  effect:
    domains: [self, health, appearance, temperament]
    polarity: 2
    themes: [self promised]
  timing: signifies(dasha_lord, [1, 5, 11]) and signifies(antardasha_lord, [1, 5, 11])
  tags: ['domain:self', 'kp:cusp1']
- id: KP.III.SelfSubDenial
  name: 1 cusp sub lord signifies only 6, 8, 12 (self)
  source:
    chapter: III
    paraphrase: If the sub lord of cusp 1 signifies 6, 8, 12 and none of 1, 5, 11, self matters are denied or long delayed.
  condition: signifies(kp_sub_lord(1), [6, 8, 12]) and not signifies(kp_sub_lord(1), [1, 5, 11])
  effect:
    domains: [self, health, appearance, temperament]
    polarity: -2
    themes: [self denied or delayed]
  tags: ['domain:self', 'kp:cusp1']
- id: KP.III.SelfSubMixed
  name: 1 cusp sub lord signifies both sets (self)
  source:
    chapter: III
    paraphrase: If the sub lord of cusp 1 signifies both 1, 5, 11 and 6, 8, 12, self matters come with obstacles.
  condition: signifies(kp_sub_lord(1), [1, 5, 11]) and signifies(kp_sub_lord(1), [6, 8, 12])
  effect:
    domains: [self, health, appearance, temperament]
    polarity: -1
    themes: [obstacles in self]
  tags: ['domain:self', 'kp:cusp1']
- id: KP.III.SelfTiming
  name: Periods of 1, 5, 11 significators (self)
  source:
    chapter: III
    paraphrase: Self matters fructify in the conjoined periods of planets signifying houses 1, 5, 11.
  condition: signifies(kp_sub_lord(1), [1, 5, 11])
  effect:
    domains: [self, health, appearance, temperament]
    polarity: 1
    themes: [period of self]
  timing: signifies(dasha_lord, [1, 5, 11]) and signifies(antardasha_lord, [1, 5, 11]) and signifies(pratyantardasha_lord,
    [1, 5, 11])
  tags: ['domain:self', 'kp:cusp1', timing]
