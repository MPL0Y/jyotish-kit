# Bhavesh in bhava (BPHS ch.24): the lord of each house placed in each house, 12 x 12 rules.
# Paraphrases are our own condensed wording of the chapter, not a translation.
# Generated once from a paraphrase table; edit this file directly from now on.
defaults:
  school: parashari
  classical_strength: primary
  source:
    text: Brihat Parashara Hora Shastra
    chapter: 24
    edition: R. Santhanam (tr.), Brihat Parasara Hora Sastra, Ranjan Publications, New Delhi, 1984
    note: verse to be confirmed against the edition; the text qualifies many results by the lord's strength and
      associations, which synthesis applies
