# House-judgement principles (BPHS ch.11) applied to houses 1-5 and 9-11; the 7th is in marriage.yaml.
# Dusthanas (6, 8, 12) are left out: whether their prospering is good for the topic (disease, longevity,
# foreign, moksha) needs its own rules. Malefics are not counted against the upachayas 3, 10, 11, which
# they traditionally strengthen. Generated once; edit this file directly from now on.
defaults:
  school: parashari
  classical_strength: primary
  source:
    text: Brihat Parashara Hora Shastra
    edition: R. Santhanam (tr.), Brihat Parasara Hora Sastra, Ranjan Publications, New Delhi, 1984
    note: the general house-judgement principles of ch.11 applied house by house; verse to be confirmed against the edition
rules:
- id: BPHS.11.H1LordAspects
  name: Lagna house aspected by its own lord
  source:
    chapter: 11
    paraphrase: A house aspected by its own lord prospers; applied to the Lagna (self).
    note: the lord occupying its own house is BPHS ch.24 (bhavesh) and not repeated here
  condition: aspects_house(lord(1), 1) and not in_house(lord(1), 1)
  effect:
    domains: [self, health, appearance, temperament]
    polarity: 1
    themes: [Lagna house supported by its lord]
  timing: lord(1) in [dasha_lord, antardasha_lord]
  tags: ['bhava:1', 'lord:1']
- id: BPHS.11.H1LordStrong
  name: Lagna lord strong in a kendra or trikona
  source:
    chapter: 11
    paraphrase: A house prospers when its lord is strong and in a kendra or trikona; applied to the Lagna (self).
  condition: strong(lord(1)) and in_house(lord(1), [1, 4, 5, 7, 9, 10])
  effect:
    domains: [self, health, appearance, temperament]
    polarity: 1
    themes: [Lagna house matters flourish]
  timing: lord(1) in [dasha_lord, antardasha_lord]
  tags: ['lord:1']
- id: BPHS.11.H1LordAfflicted
  name: Lagna lord afflicted and unaided
  source:
    chapter: 11
    paraphrase: A house suffers when its lord is joined with or aspected by malefics, combust or debilitated, without benefic
      help; applied to the Lagna (self).
  condition: afflicted(lord(1)) and not aided(lord(1))
  effect:
    domains: [self, health, appearance, temperament]
    polarity: -1
    themes: [obstacles in Lagna house matters]
  timing: lord(1) in [dasha_lord, antardasha_lord]
  tags: ['lord:1']
- id: BPHS.11.H1Benefic
  name: Benefic influence on the Lagna
  source:
    chapter: 11
    paraphrase: A house occupied or aspected by benefics, free of malefic influence, prospers; applied to the Lagna (self).
  condition: 'any(b in planets: benefic(b) and (in_house(b, 1) or aspects_house(b, 1))) and not any(m in planets: malefic(m)
    and (in_house(m, 1) or aspects_house(m, 1)))'
  effect:
    domains: [self, health, appearance, temperament]
    polarity: 1
    themes: [Lagna house matters protected]
  tags: ['bhava:1']
- id: BPHS.11.H1Malefic
  name: Malefic influence on the Lagna
  source:
    chapter: 11
    paraphrase: A house occupied or aspected by malefics with no benefic influence is harmed; applied to the Lagna (self).
  condition: 'any(m in planets: malefic(m) and (in_house(m, 1) or aspects_house(m, 1))) and not any(b in planets: benefic(b)
    and (in_house(b, 1) or aspects_house(b, 1)))'
  effect:
    domains: [self, health, appearance, temperament]
    polarity: -1
    themes: [Lagna house matters harmed]
  tags: ['bhava:1']
