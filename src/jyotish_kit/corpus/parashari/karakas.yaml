# Natural karakas (BPHS ch.32) strong or weak; Venus (spouse) is in marriage.yaml. Career's several karakas
# are left to the triple confirmation rather than scored four times. Generated once; edit directly.
defaults:
  school: parashari
  classical_strength: primary
  source:
    text: Brihat Parashara Hora Shastra
    edition: R. Santhanam (tr.), Brihat Parasara Hora Sastra, Ranjan Publications, New Delhi, 1984
    note: karaka assignments of ch.32; verse to be confirmed against the edition
rules:
- id: BPHS.32.SunKarakaStrong
  name: Sun (karaka of self, father) strong and well placed
  source:
    chapter: 32
    paraphrase: Sun as natural significator of self, father, when strong and outside the dusthanas, supports those matters.
  condition: strong(Sun) and not in_house(Sun, dusthana)
  effect:
    domains: [self, father]
    polarity: 1
    themes: [self supported, father supported]
  timing: Sun in [dasha_lord, antardasha_lord]
  tags: ['karaka:Sun']
- id: BPHS.32.SunKarakaWeak
  name: Sun (karaka of self, father) weak or in a dusthana
  source:
    chapter: 32
    paraphrase: Sun as natural significator of self, father, when weak (debilitated, combust, defeated) or in a dusthana,
      harms those matters.
  condition: (weak(Sun) or in_house(Sun, dusthana)) and not aided(Sun)
  effect:
    domains: [self, father]
    polarity: -1
    themes: [self strained, father strained]
  timing: Sun in [dasha_lord, antardasha_lord]
  tags: ['karaka:Sun']
